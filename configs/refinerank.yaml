# RefineRank frozen pipeline config.
# Derived from the research repo's configs/medvidu/frozen_stg_ranker.yaml.
# Only the final-submission sections are kept; all ablation/comparison
# sections (ranker, factorized_ranker, fusion_*, privileged_*,
# hierarchical_*, *_screening, legal_extra_trees, nested_proposal) were
# removed intentionally.

model:
  # Frozen MedVLM (Qwen2.5-VL architecture), HF format, local files only.
  medvlm_path: checkpoints/vlm/uAI-NEXUS-MedVLM-1.0a-7B-RL
  # Frozen GroundingDINO SwinB detector weights.
  groundingdino_checkpoint: checkpoints/grounding_dino/groundingdino_swinb_cogcoor.pth
  # GroundingDINO source checkout + model config (dino-tubes step only).
  # NOTE: 需按本机 GroundingDINO 仓库位置修改。
  groundingdino_repo: ../baselines/GroundingDINO
  groundingdino_config: ../baselines/GroundingDINO/groundingdino/config/GroundingDINO_SwinB_cfg.py
  device: cuda
  dtype: bfloat16
  visual_layers: [7, 15, 23, 31]

data:
  # NOTE: 以下数据集路径需按本机数据集位置修改（原研究仓库使用 /mnt/f/Datasets/medvidu）。
  train_split: /mnt/f/Datasets/medvidu/splits/medvidu_train_9_1.json
  val_split: /mnt/f/Datasets/medvidu/splits/medvidu_val_9_1.json
  valdata_root: /mnt/f/Datasets/medvidu/valdata
  # GroundingDINO tube JSONL produced by `python interface.py dino-tubes`.
  # NOTE: 需按本机数据集位置修改（或先跑 dino-tubes 生成）。
  train_tube_candidates: /mnt/f/Datasets/medvidu/tubes/train_tube_candidates.jsonl
  val_tube_candidates: /mnt/f/Datasets/medvidu/tubes/public_tube_candidates.jsonl
  candidate_pool_cap: 128
  val_candidate_pool_cap: 160
  shortlist_policies:
    - name: diversity_mmr_k48
      strategy: diversity_mmr
      k: 48
      native_anchor_count: 16
      diversity_alpha: 0.5
    - name: native_k96_control
      strategy: native
      k: 96
  shortlist_k: null
  oracle_tolerance: 0.005
  expand_radius: 4.0
  max_candidate_time_delta: 0.0

# RefineNet: the only trainable module (QueryConditionedProposalAdapter).
# Field names are load-bearing: checkpoints store adapter_config as a dict
# and deserialize with ProposalAdapterConfig(**config["proposal_adapter"]).
proposal_adapter:
  d_model: 128
  hidden_dim: 256
  dropout: 0.1
  max_trainable_parameters: 1500000
  center_shift_scale: 0.5
  max_log_scale: 0.6931471805599453
  regression_anchor_count: 8
  shortlist_k: 48
  native_anchor_count: 16
  quality_weight: 0.7
  diversity_weight: 0.3

# Spatial-grid cache reconstruction tolerances (predict-time exact repooling).
spatial_cache:
  reconstruction_atol: 0.005
  moved_roi_min_l2: 0.00001
  moved_roi_changed_fraction_min: 0.99
  refined_roi_changed_fraction_min: 0.95

# RefineNet optimizer. Field names are load-bearing: checkpoints store
# train_config as a dict and deserialize with OOFConfig(**config["train"]).
train:
  folds: 5
  epochs: 40
  groups_per_dataset: 16
  learning_rate: 0.0003
  weight_decay: 0.01
  gradient_clip: 1.0
  seed: 20260719
  eval_batch_size: 48

# Parameter-free decoder: non-Cholec top-1 argmax, CholecTrack20 shape-DP.
decoder:
  policy: augmented_dp_shape_cholec
  dp_lambda: 0.2
  cholec_top_k: 20
  non_cholec_policy: top1
